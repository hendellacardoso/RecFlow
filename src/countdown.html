<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
  <title>GT Contagem</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    .ring {
      position: absolute; inset: 20px; border-radius: 50%; background: rgba(20, 22, 27, .82);
      display: grid; place-items: center; box-shadow: 0 10px 40px rgba(0, 0, 0, .45);
    }
    svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    circle { fill: none; stroke: #ff3b30; stroke-width: 8; stroke-linecap: round; }
    #n { font: 700 110px "Segoe UI", sans-serif; color: #fff; animation: pop 1s ease-out infinite; }
    .hint { position: absolute; bottom: 52px; width: 100%; text-align: center; color: #c9ccd3; font: 12px "Segoe UI", sans-serif; }
    @keyframes pop { 0% { transform: scale(1.35); opacity: 0; } 15% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div class="ring">
    <svg viewBox="0 0 100 100"><circle id="arc" cx="50" cy="50" r="45"/></svg>
    <span id="n"></span>
    <div class="hint">a gravação vai começar</div>
  </div>
  <script src="countdown.js"></script>
</body>
</html>
