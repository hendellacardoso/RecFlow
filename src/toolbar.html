<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>GT Ferramentas</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font: 12px "Segoe UI", sans-serif; }
    .bar {
      position: absolute; inset: 4px; display: flex; align-items: center; gap: 3px; padding: 0 8px;
      background: #1b1e25f5; border: 1px solid #2d323d; border-radius: 12px; color: #e7e9ee;
    }
    .drag { -webkit-app-region: drag; width: 14px; height: 30px; cursor: move;
      background: radial-gradient(#6b7280 1.2px, transparent 1.3px) 0 0 / 5px 5px; opacity: .8; margin-right: 4px; }
    button {
      -webkit-app-region: no-drag; width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent;
      color: #e7e9ee; display: grid; place-items: center; cursor: pointer; padding: 0;
    }
    button:hover { background: #ffffff14; }
    button.on { background: #3b82f6; }
    svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .sep { width: 1px; height: 26px; background: #2d323d; margin: 0 5px; }
    .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; }
    .sw.on { border-color: #fff; background-clip: padding-box; box-shadow: 0 0 0 1px #0006; }
    button.swb { width: 26px; }
    button.swb:hover { background: transparent; }
    .dot { border-radius: 50%; background: currentColor; }
    .close:hover { background: #ff3b30; }
  </style>
</head>
<body>
  <div class="bar">
    <div class="drag" title="Arrastar"></div>
    <button data-tool="pen" title="Caneta"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg></button>
    <button data-tool="highlighter" title="Marca-texto"><svg viewBox="0 0 24 24"><path d="M9 15l-3 3h5l1-1M9 15l7-10 4 3-7 10z"/><path d="M4 21h16"/></svg></button>
    <button data-tool="line" title="Linha"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
    <button data-tool="arrow" title="Seta"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
    <button data-tool="rect" title="Retângulo"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <button data-tool="ellipse" title="Elipse"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg></button>
    <button data-tool="eraser" title="Borracha"><svg viewBox="0 0 24 24"><path d="M7 20h11M4.5 14.5l9-9a2 2 0 012.8 0l2.2 2.2a2 2 0 010 2.8L11 18H8z"/></svg></button>
    <div class="sep"></div>
    <div id="colors" style="display:flex"></div>
    <div class="sep"></div>
    <button data-width="2" title="Fino"><span class="dot" style="width:5px;height:5px"></span></button>
    <button data-width="4" title="Médio"><span class="dot" style="width:9px;height:9px"></span></button>
    <button data-width="8" title="Grosso"><span class="dot" style="width:14px;height:14px"></span></button>
    <div class="sep"></div>
    <button id="undo" title="Desfazer (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button id="clear" title="Limpar tudo"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    <button id="close" class="close" title="Sair do desenho (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <script src="toolbar.js"></script>
</body>
</html>
