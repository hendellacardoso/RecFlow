<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' file: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Editor</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body class="editor">
  <header class="topbar">
    <div class="brand"><img class="logo-img" src="../assets/icon.png" alt="" title="RecFlow Editor"><span id="fileName">Editor</span><span id="dirty" class="dirty" hidden>• não salvo</span></div>

    <nav class="modes" id="tools">
      <button data-tool="select" title="Selecionar e mover (V)">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg><span>Selecionar</span>
      </button>
      <button data-tool="zoom" title="Zoom em área: arraste no vídeo (Z)">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M10.5 8v5M8 10.5h5"/></svg><span>Zoom</span>
      </button>
      <button data-tool="text" title="Texto: clique no vídeo (T)">
        <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg><span>Texto</span>
      </button>
      <button data-tool="draw" title="Desenhar no vídeo (D)">
        <svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg><span>Desenho</span>
      </button>
    </nav>

    <div class="draw-opts" id="drawOpts" hidden>
      <select id="drawShape" title="Forma">
        <option value="pen">Caneta</option>
        <option value="highlighter">Marca-texto</option>
        <option value="arrow">Seta</option>
        <option value="line">Linha</option>
        <option value="rect">Retângulo</option>
        <option value="ellipse">Elipse</option>
      </select>
      <div class="swatches" id="drawColors"></div>
      <select id="drawWidth" title="Espessura">
        <option value="3">Fino</option>
        <option value="6" selected>Médio</option>
        <option value="12">Grosso</option>
      </select>
    </div>

    <div class="rec-controls">
      <button id="btnUndo" class="icon-btn" title="Desfazer (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>
      </button>
      <button id="btnRedo" class="icon-btn" title="Refazer (Ctrl+Y)" disabled>
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg>
      </button>
      <button id="btnOpenProj" class="icon-btn" title="Abrir projeto">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
      </button>
      <button id="btnSaveProj" class="btn" title="Salvar projeto para continuar depois (Ctrl+S · Ctrl+Shift+S salva como)">Salvar projeto</button>
      <select id="exportFmt" title="Formato do vídeo final">
        <option value="mp4-18">MP4 · alta qualidade</option>
        <option value="mp4-22" selected>MP4 · normal</option>
        <option value="mp4-28">MP4 · arquivo menor</option>
        <option value="whatsapp">WhatsApp / e-mail (até 720p, ~15 MB)</option>
        <option value="gif">GIF animado</option>
      </select>
      <button id="btnSave" class="btn primary" title="Gerar o vídeo final (Ctrl+E)">Exportar</button>
    </div>
  </header>

  <div class="ed-body">
    <section class="stage-col">
      <div id="stage" class="stage">
        <div id="viewport" class="viewport">
          <div id="zoomBox" class="zoombox"><video id="video" preload="auto" playsinline></video></div>
          <canvas id="notesCanvas"></canvas>
          <div id="ui" class="ui-layer">
            <div id="zoomRect" class="zoom-rect" hidden>
              <span class="zr-label" id="zoomLabel">2.0×</span>
              <i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i>
            </div>
            <div id="textBox" class="text-box" hidden></div>
            <div id="dragRect" class="drag-rect" hidden></div>
          </div>
        </div>
        <div id="loading" class="loading">Carregando vídeo…</div>
      </div>

      <div class="transport">
        <button id="btnStart" class="icon-btn" title="Início (Home)"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 5l-9 7 9 7z"/></svg></button>
        <button id="btnBack" class="icon-btn" title="Quadro anterior (←)"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button id="btnPlay" class="play-btn" title="Reproduzir / pausar (Espaço)"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>
        <button id="btnFwd" class="icon-btn" title="Próximo quadro (→)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button id="btnEnd" class="icon-btn" title="Fim (End)"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l9 7-9 7z"/></svg></button>
        <div class="tc"><span id="tcNow">00:00.00</span> <span class="muted">/ <span id="tcTotal">00:00.00</span></span></div>
        <div class="spacer"></div>
        <span class="muted">Duração final: <b id="tcFinal">00:00</b></span>
        <select id="speed" title="Velocidade">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
        <label class="vol" title="Volume">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6"/></svg>
          <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
        </label>
      </div>
    </section>

    <aside class="inspector" id="inspector"></aside>
  </div>

  <section class="timeline">
    <div class="tl-toolbar">
      <button id="btnIn" class="btn small" title="Marcar início no ponto atual (I)">⟦ Marcar início</button>
      <button id="btnOut" class="btn small" title="Marcar fim no ponto atual (O)">Marcar fim ⟧</button>
      <button id="btnCut" class="btn small" title="Remover um trecho a partir do ponto atual (X)">✂ Remover trecho</button>
      <span class="sep"></span>
      <button id="btnAddZoom" class="btn small">+ Zoom</button>
      <button id="btnAddText" class="btn small">+ Texto</button>
      <button id="btnAddSub" class="btn small" title="Legenda no ponto atual">+ Legenda</button>
      <div class="spacer"></div>
      <span class="muted small">Arraste nas faixas para criar · arraste blocos para mover · bordas para ajustar</span>
      <label class="tl-zoom" title="Aproximar a linha do tempo">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
        <input type="range" id="tlZoom" min="1" max="40" step="0.5" value="1">
      </label>
    </div>
    <div class="tl-main">
      <div class="tl-labels">
        <div style="height:22px"></div>
        <div class="lab" style="height:56px">Vídeo</div>
        <div class="lab" style="height:40px">Áudio</div>
        <div class="lab cut">Cortes</div>
        <div class="lab zoom">Zoom</div>
        <div class="lab notes" id="notesLabel">Anotações</div>
        <div class="lab subs">Legendas</div>
        <div class="lab voice">Narração</div>
      </div>
      <div id="tlScroll" class="tl-scroll">
        <div id="tlInner" class="tl-inner">
          <canvas id="tlCanvas"></canvas>
          <div id="trkCut" class="track cut" data-track="cut">
            <div id="dimIn" class="dim"></div><div id="dimOut" class="dim"></div>
            <div id="hIn" class="io-handle" data-io="in" title="Início do vídeo"></div>
            <div id="hOut" class="io-handle" data-io="out" title="Fim do vídeo"></div>
          </div>
          <div id="trkZoom" class="track zoom" data-track="zoom"></div>
          <div id="trkNotes" class="track notes" data-track="notes"></div>
          <div id="trkSubs" class="track subs" data-track="subs"></div>
          <div id="trkVoice" class="track voice" data-track="voice"></div>
          <div id="playhead" class="playhead"><span></span></div>
        </div>
      </div>
    </div>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="mTitle">Exportando vídeo…</h2>
      <p id="mText" class="hint"></p>
      <div class="bar"><div id="mBar"></div></div>
      <div class="modal-actions" id="mActions"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="auxMedia" hidden></div>
  <script src="brand.js"></script>
  <script src="editor.js"></script>
</body>
</html>
